# MMCLAST-cg on horse2zebra — variant "base"  (round 1, second GPU)
#
# Rewiring only: no L_latcyc, no L_path, no D_mix.  This is the arm that
# answers the headline question on its own — does splitting CycleGAN at the
# bottleneck and putting one invertible flow in the gap beat the CycleGAN it
# was cut from?  On ADNI it did, by +0.083 T1->FA over the host, and it is the
# row the whole method rests on.  Here the same question is asked in FID.
#
# It is also the arm that tore on ADNI: its morph changed the SOURCE view
# instead of the target, and its FA->T1 path opened huge holes (dark fraction
# 0.58/0.61/0.53 against a real-T1 floor of 0.001).  Whether that pathology is
# a property of `base` or a property of T1/FA is exactly what a second dataset
# can settle.
#
#   CUDA_VISIBLE_DEVICES=1 python train.py --config configs/h2z_base.yaml
variant: base
tag: h2z_base

# data ---------------------------------------------------------------------
data: folder
data_root: /ix/lzhan/siyuan/datasets/processed_datas/horse2zebra
img_ch: 3
load_size: 286
crop_size: 256
eval_batch: 8
seed: 42
workers: 6

warm: exps/checkpoints/h2z_host/last.pth

# schedule -----------------------------------------------------------------
e1: 120
p1: 20
e2: 80
p2: 15
e3: 120
p3: 20
batch: 8
lr: 2.0e-4
lr_flow: 1.0e-4
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 9
n_flow: 4
flow_hidden: 128
pre_relu: 1

# loss weights -------------------------------------------------------------
# The variant preset pins w_latcyc / w_path_* to 0 regardless of what is
# written here; they are listed for the record.
w_self: 10.0
w_cross: 0.0              # UNPAIRED
w_gan: 1.0
w_cyc: 10.0
w_latcyc: 0.0
w_path_gan: 0.0
w_path_smooth: 0.0
s2_cyc: 1                 # w_latcyc is 0 here, so S2 gets GAN + cycle only
