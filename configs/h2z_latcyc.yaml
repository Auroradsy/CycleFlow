# MMCLAST-cg on horse2zebra — variant "latcyc"  (round 1)
#
# The point of this run is NOT the path.  It is to establish that the split +
# flow survives a move to a dataset with none of ADNI's conveniences:
#   * unpaired          -> L_cross is gone (w_cross 0), which is what S2 rode on
#   * 3-channel, 256px  -> bottleneck 256x64x64 instead of 256x28x28
#   * no ground truth   -> quality is FID, not SSIM-against-the-other-modality
#
# The path can still be WALKED without being supervised (`m.walk`), so this run
# already shows what an unsupervised trajectory looks like — which is the
# question "no D_mix, just look at the path" actually asks.
#
#   python train.py --config configs/h2z_latcyc.yaml
variant: latcyc
tag: h2z_latcyc

# data ---------------------------------------------------------------------
data: folder
data_root: /data_new2/public_share/horse2zebra
img_ch: 3
load_size: 286              # resize, then random-crop to crop_size (CycleGAN)
crop_size: 256
eval_batch: 8
seed: 42
workers: 6

# warm start ---------------------------------------------------------------
# Plain CycleGAN trained on horse2zebra, split into E_A/D_B and E_B/D_A.
# Swap to h2z_host_ours/last.pth once our own host finishes training.
warm: exps/checkpoints/h2z_host/last.pth

# schedule -----------------------------------------------------------------
# Identical to the ADNI runs — same epoch budgets, same patience, same batch
# and LR — so "the method transfers" is a claim about the data, not about a
# re-tuned schedule.  Measured cost at batch 8: S1 ~85 s, S2 ~110 s, S3 ~230 s
# per epoch, and early stopping usually fires well before the cap.
e1: 120
p1: 20
e2: 80
p2: 15
e3: 120
p3: 20
batch: 8
lr: 2.0e-4
lr_flow: 1.0e-4
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 9               # reference CycleGAN uses resnet_9blocks at 256px
n_flow: 4                 # flow blocks — also the number of morph frames
flow_hidden: 128
pre_relu: 1

# loss weights -------------------------------------------------------------
w_self: 10.0
w_cross: 0.0              # UNPAIRED: no ground-truth target for the cross paths
w_gan: 1.0
w_cyc: 10.0               # the content constraint, now that L_cross is gone
w_latcyc: 2.0
w_path_gan: 0.0
w_path_smooth: 0.0
s2_cyc: 1                 # required: S2 has only the GAN term otherwise
