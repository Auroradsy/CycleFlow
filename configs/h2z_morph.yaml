# MMCLAST-cg on horse2zebra — variant "morph"  (round 2, S3 ablation)
#
# Identical to h2z_latcyc except for the two path terms, so an arm started from
# h2z_latcyc/stage2.pth differs from the round-1 run in S3 ONLY.  That is the
# control the ADNI ablation lacked: there, each variant ran its own S1 with its
# own early stop, so "morph vs latcyc" also compared two different encoders.
#
#   bash configs/run_h2z_s3.sh          # abs / ra / smooth, from one S2
#
# Why D_mix is better posed here than on ADNI: horses and zebras share the whole
# background distribution and differ only in the texture on the animal, so
# "real A U real B" is a coherent image distribution and a half-striped horse
# sits near it.  T1 and FA differ in global intensity statistics, so their union
# is bimodal and the midpoint is nobody's real image — which is what made the
# absolute critic misbehave there.
variant: morph
tag: h2z_morph

# data ---------------------------------------------------------------------
data: folder
data_root: /data_new2/public_share/horse2zebra
img_ch: 3
load_size: 286
crop_size: 256
eval_batch: 8
seed: 42
workers: 6

warm: exps/checkpoints/h2z_host/last.pth

# schedule -----------------------------------------------------------------
# Same as the ADNI runs.  S1/S2 are skipped when resuming from the shared
# stage-2 checkpoint, so only e3/p3 actually bite here.
e1: 120
p1: 20
e2: 80
p2: 15
e3: 120
p3: 20
batch: 8
lr: 2.0e-4
lr_flow: 1.0e-4
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 9
n_flow: 4
flow_hidden: 128
pre_relu: 1

# loss weights -------------------------------------------------------------
w_self: 10.0
w_cross: 0.0              # UNPAIRED
w_gan: 1.0
w_cyc: 10.0
w_latcyc: 2.0
w_path_gan: 0.5           # 0 for the smooth-only arm
w_path_smooth: 1.0
s2_cyc: 1
